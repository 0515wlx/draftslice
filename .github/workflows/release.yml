name: Release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[bench]"
      - name: Lint
        run: ruff check .
      - name: Conformance and unit tests
        run: pytest -q
      - name: Build a verifiable release report from synthetic results
        run: python benchmarks/smoke_pipeline.py --out-dir runs/release-gate
      - name: Verify the release manifest
        run: draftslice bench validate --manifest runs/release-gate/report.manifest.json
      - name: Upload release gate report
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: runs/release-gate/
