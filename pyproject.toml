[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "draftslice"
version = "0.0.1"
description = "Exact, constraint-aware draft-head slicing for speculative decoding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "DraftSlice contributors" }]
keywords = [
  "speculative-decoding",
  "llm-inference",
  "draft-head",
  "grammar-constrained-decoding",
  "eagle",
  "dflash",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
runtime = ["torch>=2.2"]
kernels = ["torch>=2.2", "triton>=3.0"]
bench = ["torch>=2.2", "triton>=3.0", "numpy>=1.24"]
vllm = ["vllm>=0.34"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
draftslice = "draftslice.cli:main"

[project.entry-points."vllm.general_plugins"]
draftslice = "draftslice.integrations.vllm:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research", "data", "plans", "figures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "perf: GPU performance tests; set DRAFTSLICE_RUN_PERF=1 and lock clocks",
]
